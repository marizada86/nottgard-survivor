add_version: "0.2"
project:
  id: "PRJ-NOTTGARD-SURVIVORS"
  name: "Nottgard Survivors"
interaction:
  default_mode: "direct"
  atena:
    trigger: "explicit-address"
    mode: "guided"
  direct_execution:
    allow_without_spec: true
    reconciliation: "propose-after-change"
specification:
  require_zero_blocking_gaps: true
  allow_explicit_defer: true
  recommend_defaults: true
bootstrap:
  tooling_checks:
    rtk:
      enabled: true
      required: false
      ask_if_missing: true
      ask_once: true
      status: "enabled"   # rtk 0.50.0 detectado em 2026-10-03
policies:
  remote_context: "review-before-remote"
  draft_writing: "allowed"
  publishing: "explicit-approval"
  dependencies: "allowlist-with-plan"
autonomy:
  profile: "guarded-autopilot"
  approval_selection: "required-per-plan"   # substitui execution_approval: per-spec (ADD upstream 2026-10-03)
  report_mode: "exceptions-and-final"
  max_retries: 3
git:
  local_commits: "explicit-approval"
  direct_local_commits: "explicit-approval"
  merge: "explicit-approval"
  publish: "explicit-approval"
skills:
  record_opportunity_after_repetitions: 2
  propose_after_repetitions: 3
graph:
  mode: "derived"
  output: "generated/graph.production.json"
backlog:
  path: ".atena/backlog"
  tracks: ["arte-audio", "mecanicas", "bugs", "balanceamento", "ferramentas"]
  release_order: ["bugs", "arte-audio", "mecanicas", "balanceamento"]
  mechanics_per_playtest_build: "unlimited"   # decisao do dono 2026-09-29: build rica em conteudo
  one_commit_per_mechanic: true
  mechanics_share_commit_with_other_tracks: false
  bug_p0: "fix-immediately"
  bug_batch_close: "next-playtest-with-new-version"   # bug implementado e nao citado de novo = corrigido
  bug_batch_warning: "five-or-more-p1"
  build_id_required_for_playtest: true
  remind_open_bugs: ["session-start", "before-export", "before-commit"]
  check_script: "tools/backlog_check.ps1"
